name: Deploy RI Field Report to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - uses: actions/configure-pages@v5
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for the Pages artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts[] | select(.expired == false) | .id') && [[ -n "$artifact_id" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The uploaded Pages artifact did not become visible."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
